name = "expense-tracker-line-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Keeps the logs this Worker already writes. Every console.error in src/ (a
# failed Drive upload, a refresh token that stopped working, a Places API
# error, a persona call that fell back) was being emitted and then discarded,
# because nothing was configured to retain it — which meant the only way to
# find out something had broken was for someone to notice and complain.
#
# Costs nothing at runtime: those console calls run either way, and ingestion
# happens on Cloudflare's side, not inside this Worker's CPU budget. Volume is
# dominated by the once-a-minute cron above (~1,440 invocations a day, each one
# an invocation log even when it does nothing and logs nothing), with actual
# messages and /view page loads adding a few hundred more — comfortably inside
# the free plan's daily allowance, which was 200k events/day with 3-day
# retention when this was set up. Check the dashboard rather than trusting that
# number; plan terms move. If volume ever does become a problem, add
# `head_sampling_rate = 0.1` below to keep a tenth of invocations.
#
# Note the 3-day window on the free plan: this is for catching a problem while
# it's fresh, not a long-term audit trail.
[observability]
enabled = true

# Drains the trip-photo upload queue once a minute (see uploadQueue.ts and the
# `scheduled` handler in src/index.ts). Every media file, any batch size, goes
# through this queue+drain path now (see DRAIN_BATCH_SIZE's comment in
# src/index.ts for why) — this cron firing is the only place uploads actually
# happen and confirmations get sent.
[triggers]
crons = ["* * * * *"]

# Create with: npx wrangler kv namespace create ACCOUNTS
# then paste the returned id below.
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "18630d0859b24d9591cd9025ab557cfe"

# Secrets (never put real values here — set them with `wrangler secret put <NAME>`):
#   LINE_CHANNEL_SECRET       - from LINE Developers Console > Messaging API channel
#   LINE_CHANNEL_ACCESS_TOKEN - long-lived channel access token
#   GOOGLE_CLIENT_ID          - same OAuth client used by the web app
#   GOOGLE_CLIENT_SECRET      - from the same OAuth client (Web application type)
#   STATE_SIGNING_SECRET      - any random string, used to sign the OAuth state param
#   GEMINI_API_KEY            - from https://aistudio.google.com/apikey (free tier) — powers
#                               "ถาม <คำถาม>" / "วิเคราะห์" (see aiCommands.ts, PLAN.md 15.6)
#   GOOGLE_MAPS_API_KEY       - a Maps Platform API key (Places API (New) enabled — NOT the
#                               older "Places API") from the same Google Cloud project — powers
#                               "หา...ใกล้ฉัน" (see places.ts, PLAN.md 17.30/17.31). A flat key,
#                               not OAuth — optional, same degrade-gracefully treatment as
#                               GEMINI_API_KEY if left unset
#   TRAVELPAYOUTS_TOKEN       - Travelpayouts Data API token from https://www.travelpayouts.com
#                               (free signup) — powers the real flight/hotel prices in travel
#                               search (travel.ts, PLAN.md 17.37). Optional: without it the
#                               feature still sends booking links, just without in-chat prices.
#                               (Replaced the original Amadeus credentials — that portal was
#                               decommissioned 2026-07-17 before this ever went live.)
