name: One-time - Create Worker KV namespace

on:
  workflow_dispatch:

jobs:
  create-kv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      # Pinned for the same reason as the rich-menu workflow (PLAN.md 17.51):
      # a one-time action against live infrastructure should never depend on
      # which branch the dispatch happened to be started from.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Copy the 'id' value below into worker/wrangler.toml, then delete/disable this workflow."
          npx wrangler kv namespace create ACCOUNTS
