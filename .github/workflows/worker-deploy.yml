name: Deploy LINE bot Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # This list is what actually delivers secrets to the Worker — a name in
      # wrangler.toml's comments or in Env (worker/src/index.ts) does nothing
      # on its own. A secret added to the repository but not added here is
      # simply never uploaded, and the Worker sees an empty string with no
      # error anywhere: that is how TMDB_READ_TOKEN shipped unset. Adding a
      # new secret means editing this list too.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.LINE_CHANNEL_SECRET }}" | npx wrangler secret put LINE_CHANNEL_SECRET
          echo "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
          echo "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          echo "${{ secrets.STATE_SIGNING_SECRET }}" | npx wrangler secret put STATE_SIGNING_SECRET
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          echo "${{ secrets.GOOGLE_MAPS_API_KEY }}" | npx wrangler secret put GOOGLE_MAPS_API_KEY
          echo "${{ secrets.TRAVELPAYOUTS_TOKEN }}" | npx wrangler secret put TRAVELPAYOUTS_TOKEN
          echo "${{ secrets.TMDB_READ_TOKEN }}" | npx wrangler secret put TMDB_READ_TOKEN
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
