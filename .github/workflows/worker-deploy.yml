name: Deploy LINE bot Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.LINE_CHANNEL_SECRET }}" | npx wrangler secret put LINE_CHANNEL_SECRET
          echo "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
          echo "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          echo "${{ secrets.STATE_SIGNING_SECRET }}" | npx wrangler secret put STATE_SIGNING_SECRET
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          echo "${{ secrets.GOOGLE_MAPS_API_KEY }}" | npx wrangler secret put GOOGLE_MAPS_API_KEY
          echo "${{ secrets.AMADEUS_CLIENT_ID }}" | npx wrangler secret put AMADEUS_CLIENT_ID
          echo "${{ secrets.AMADEUS_CLIENT_SECRET }}" | npx wrangler secret put AMADEUS_CLIENT_SECRET
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
